name: Hanik Improvement Loop

# One run of this workflow is one iteration of the Hanik improvement loop, and
# one iteration is one fresh session: the runner starts clean, the loop reads
# everything it needs from the repository, and it leaves a brief for whoever
# runs next.
#
# Triggers:
#   - workflow_dispatch: a human starts the chain.
#   - repository_dispatch (type: hanik-continue): this workflow asking for one
#     more iteration, using a dedicated HANIK_DISPATCH_TOKEN, and only when the
#     loop itself reported should_continue=true.
#
# There is deliberately no schedule trigger and no in-process loop. The loop
# stops asking for another run when there are no open tasks, when the evidence
# has stopped changing, or when a human sets HANIK_CONTINUOUS=false or
# HANIK_KILL_SWITCH=true.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [hanik-continue]

# Least-privilege permissions: enough to check out, commit generated artifacts,
# and open a pull request. Nothing else.
permissions:
  contents: write
  pull-requests: write

# Prevent overlapping iterations from racing on state/state.json.
concurrency:
  group: hanik-improvement-loop
  cancel-in-progress: false

jobs:
  iterate:
    runs-on: ubuntu-latest
    # Kill switch, evaluated before checkout: setting the HANIK_KILL_SWITCH
    # repository variable to 'true' stops the loop without touching secrets,
    # cancelling runs, or editing this file.
    if: vars.HANIK_KILL_SWITCH != 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v

      - name: Run one Hanik iteration
        id: iterate
        env:
          # Absolute ceiling on the iteration counter. Stagnation detection,
          # not this number, is what normally ends a chain.
          HANIK_MAX_ITERATIONS: ${{ vars.HANIK_MAX_ITERATIONS || '10000' }}
          # Consecutive iterations with identical evidence before the loop
          # stops requesting another run.
          HANIK_STAGNATION_LIMIT: ${{ vars.HANIK_STAGNATION_LIMIT || '2' }}
          # Full history entries retained in state/state.json; older entries
          # are archived to state/archive/ rather than dropped.
          HANIK_HISTORY_LIMIT: ${{ vars.HANIK_HISTORY_LIMIT || '50' }}
          # Set to 'false' to stop the chain after the current run.
          HANIK_CONTINUOUS: ${{ vars.HANIK_CONTINUOUS || 'true' }}
        run: |
          set -euo pipefail
          python3 -m src.hanik_loop

      - name: Summarise the iteration
        if: always()
        run: |
          set -euo pipefail
          if [ -f state/next-session.md ]; then
            cat state/next-session.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No session brief was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload iteration artifacts
        # Always upload, so results survive a later failure in this job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanik-loop-output
          path: |
            reports/
            state/
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update pull request with results
        if: steps.iterate.outputs.status == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Hanik loop: iteration ${{ steps.iterate.outputs.iteration }} evidence"
          title: "Hanik loop: iteration ${{ steps.iterate.outputs.iteration }}"
          body: >-
            Automated evidence run from the Hanik improvement loop.
            Score ${{ steps.iterate.outputs.overall_score }}
            (${{ steps.iterate.outputs.checks_passed }}/${{ steps.iterate.outputs.checks_total }}
            checks passing), ${{ steps.iterate.outputs.open_tasks }} open task(s).
            The next session's brief is in `state/next-session.md`.
            A human reviews and lands this; the loop never lands its own work.
          branch: hanik-loop/iteration-results
          add-paths: |
            reports/
            state/
          labels: hanik-loop

      # Continuation is earned: the loop sets should_continue only when the run
      # succeeded, open tasks remain, the evidence actually changed recently,
      # and HANIK_CONTINUOUS was not disabled. A failed step leaves the output
      # unset, so a failure silently stops the chain.
      #
      # The dispatch uses a dedicated HANIK_DISPATCH_TOKEN rather than the
      # default GITHUB_TOKEN, because GitHub Actions intentionally refuses to
      # start new runs from GITHUB_TOKEN-authored events. Keeping it separate
      # also means revoking one secret stops everything (see SECURITY.md).
      - name: Request the next iteration
        if: steps.iterate.outputs.should_continue == 'true'
        env:
          HANIK_DISPATCH_TOKEN: ${{ secrets.HANIK_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HANIK_DISPATCH_TOKEN:-}" ]; then
            echo "HANIK_DISPATCH_TOKEN is not configured; stopping after this iteration." >&2
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${HANIK_DISPATCH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"hanik-continue"}'

      - name: Explain why the chain stopped
        if: steps.iterate.outputs.status == 'success' && steps.iterate.outputs.should_continue != 'true'
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Chain stopped"
            echo ""
            echo "Open tasks: ${{ steps.iterate.outputs.open_tasks }}"
            echo "Iterations without measurable change: ${{ steps.iterate.outputs.stagnant_iterations }}"
            echo ""
            echo "Re-running would regenerate identical evidence. Implement a task from"
            echo "state/next-session.md, or raise the bar with a new check, then dispatch again."
          } >> "$GITHUB_STEP_SUMMARY"
