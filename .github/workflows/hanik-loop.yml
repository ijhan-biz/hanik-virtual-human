name: Hanik Improvement Loop

# One run of this workflow is one iteration of the Hanik improvement loop, and
# one iteration is one fresh implementation session followed by one evaluation:
# the runner starts clean, the agent reads the brief, changes the repository,
# and the evaluator measures that change.
#
# Triggers:
#   - workflow_dispatch: a human starts the chain.
#   - repository_dispatch (type: hanik-continue): this workflow asking for one
#     more implementation session, using a dedicated HANIK_DISPATCH_TOKEN, and
#     only when the loop itself reported should_continue=true.
#
# There is deliberately no schedule trigger and no in-process loop. The loop
# stops asking for another run when evidence has stopped changing, when the
# safety ceiling is reached, or when a human sets HANIK_CONTINUOUS=false or
# HANIK_KILL_SWITCH=true. A clean score starts another implementation session
# that must add a new evidence check rather than ending the chain.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [hanik-continue]

# Least-privilege permissions: enough to check out, commit generated artifacts,
# and open a pull request. Nothing else.
permissions:
  contents: write
  pull-requests: write

# Prevent overlapping iterations from racing on state/state.json.
concurrency:
  group: hanik-improvement-loop
  cancel-in-progress: false

jobs:
  iterate:
    runs-on: ubuntu-latest
    # Kill switch, evaluated before checkout: setting the HANIK_KILL_SWITCH
    # repository variable to 'true' stops the loop without touching secrets,
    # cancelling runs, or editing this file.
    if: vars.HANIK_KILL_SWITCH != 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The first run starts from the selected ref (normally main). Once
          # the loop dispatches its next fresh session, continue from the
          # results branch so state/next-session.md and the prior evidence are
          # available even though the pull request is still awaiting review.
          ref: ${{ github.event_name == 'repository_dispatch' && 'hanik-loop/iteration-results' || github.ref }}

      - name: Sync the implementation branch with main
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail
          git config user.name "hanik-loop[bot]"
          git config user.email "hanik-loop[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit -X ours origin/main; then
            git checkout --ours .
            git add -A
            git commit -m "Preserve iteration branch while syncing main"
          fi
          git checkout origin/main -- .github/workflows/hanik-loop.yml
          if ! git diff --cached --quiet; then
            git add .github/workflows/hanik-loop.yml
            git commit -m "Sync loop workflow baseline"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Implement one brief task
        id: implement
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.HANIK_COPILOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "HANIK_COPILOT_TOKEN is required: add a fine-grained token with Copilot Requests permission." >&2
            exit 1
          fi
          before="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then
            echo "The implementation session must start from a clean checkout." >&2
            exit 1
          fi
          prompt="$(cat state/next-session.md)"
          copilot -p "You are the Hanik implementation session. Read AGENTS.md first, then implement exactly the first task in the session brief below. Work on the actual artifact, not on weakening checks. If all checks currently pass, add one substantive evidence check for a capability Hanik genuinely lacks, with remediation and targets. You may update directly related documentation and tests. Do not add secrets, network access, dynamic execution, a timer trigger, or any self-approval step. Do not run src.hanik_loop; the workflow runs the evaluator after you. Run the focused tests needed for your change, leave the repository with the implementation in place, and do not wait for a user response. Session brief:
          ${prompt}" \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(python3:*)' \
            --allow-tool=write \
            --no-ask-user
          after="$(git rev-parse HEAD)"
          changed="$(git status --porcelain)"
          if [ "$before" = "$after" ] && [ -z "$changed" ]; then
            echo "The implementation session made no repository change; stopping instead of fabricating progress." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v

      - name: Evaluate one Hanik iteration
        id: iterate
        env:
          # Absolute ceiling on the iteration counter. Stagnation detection,
          # not this number, is what normally ends a chain.
          HANIK_MAX_ITERATIONS: ${{ vars.HANIK_MAX_ITERATIONS || '10000' }}
          # Consecutive iterations with identical evidence before the loop
          # stops requesting another run.
          HANIK_STAGNATION_LIMIT: ${{ vars.HANIK_STAGNATION_LIMIT || '2' }}
          # Full history entries retained in state/state.json; older entries
          # are archived to state/archive/ rather than dropped.
          HANIK_HISTORY_LIMIT: ${{ vars.HANIK_HISTORY_LIMIT || '50' }}
          # Set to 'false' to stop the chain after the current run.
          HANIK_CONTINUOUS: ${{ vars.HANIK_CONTINUOUS || 'true' }}
        run: |
          set -euo pipefail
          python3 -m src.hanik_loop

      - name: Summarise the iteration
        if: always()
        run: |
          set -euo pipefail
          if [ -f state/next-session.md ]; then
            cat state/next-session.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No session brief was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload iteration artifacts
        # Always upload, so results survive a later failure in this job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanik-loop-output
          path: |
            reports/
            state/
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update pull request with results
        if: steps.iterate.outputs.status == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Hanik loop: iteration ${{ steps.iterate.outputs.iteration }} evidence"
          title: "Hanik loop: iteration ${{ steps.iterate.outputs.iteration }}"
          base: main
          body: >-
            Automated evidence run from the Hanik improvement loop.
            Score ${{ steps.iterate.outputs.overall_score }}
            (${{ steps.iterate.outputs.checks_passed }}/${{ steps.iterate.outputs.checks_total }}
            checks passing), ${{ steps.iterate.outputs.open_tasks }} open task(s).
            The next session's brief is in `state/next-session.md`.
            A human reviews and lands this; the loop never lands its own work.
          branch: hanik-loop/iteration-results
          add-paths: |
            .github/workflows/hanik-loop.yml
            hanik/
            src/
            tests/
            reports/
            state/
            README.md
            HANIK_SPEC.md
            DECISIONS.md
            SECURITY.md
            AGENTS.md
          labels: hanik-loop

      # Continuation is earned: the implementation and evaluation succeeded,
      # evidence changed recently (or a clean score requires a new check), and
      # HANIK_CONTINUOUS was not disabled. A failed step leaves the output
      # unset, so a failure stops the chain.
      #
      # The dispatch uses a dedicated HANIK_DISPATCH_TOKEN rather than the
      # default GITHUB_TOKEN, because GitHub Actions intentionally refuses to
      # start new runs from GITHUB_TOKEN-authored events. Keeping it separate
      # also means revoking one secret stops everything (see SECURITY.md).
      - name: Request the next iteration
        if: steps.iterate.outputs.should_continue == 'true'
        env:
          HANIK_DISPATCH_TOKEN: ${{ secrets.HANIK_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HANIK_DISPATCH_TOKEN:-}" ]; then
            echo "HANIK_DISPATCH_TOKEN is not configured; stopping after this iteration." >&2
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${HANIK_DISPATCH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"hanik-continue"}'

      - name: Explain why the chain stopped
        if: steps.iterate.outputs.status == 'success' && steps.iterate.outputs.should_continue != 'true'
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Chain stopped"
            echo ""
            echo "Open tasks: ${{ steps.iterate.outputs.open_tasks }}"
            echo "Iterations without measurable change: ${{ steps.iterate.outputs.stagnant_iterations }}"
            echo ""
            echo "Re-running would regenerate identical evidence. Implement a task from"
            echo "state/next-session.md, or raise the bar with a new check, then dispatch again."
          } >> "$GITHUB_STEP_SUMMARY"
